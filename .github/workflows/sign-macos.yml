name: Signed macOS package

on:
  workflow_call:
    inputs:
      ref:
        description: Maintainer-approved source ref, resolved before credential approval
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'arlyon/dispatch' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  sign:
    needs: source
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/commit/${{ needs.source.outputs.sha }}
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Install Developer ID identity and notarization key
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash scripts/macos-signing.sh install
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        env:
          MISE_NPM_PACKAGE_MANAGER: npm
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: developer-id
      - run: mise run setup
      - name: Build, sign and notarize the application
        # Tauri signs all bundled executables and notarizes/staples the app.
        # Missing credentials are an error; never supply the ad-hoc '-' identity.
        run: mise run package
      - name: Notarize and staple the final disk image
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(target/release/bundle/dmg/*.dmg)
          [[ ${#images[@]} -eq 1 ]]
          xcrun notarytool submit "${images[0]}" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m \
            --output-format json > "$RUNNER_TEMP/notarization.json"
          python3 - "$RUNNER_TEMP/notarization.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              result = json.load(source)
          if result.get('status') != 'Accepted':
              raise SystemExit('DMG notarization was not accepted; submission ' + str(result.get('id', 'unknown')))
          PY
          xcrun stapler staple "${images[0]}"
      - name: Verify nested signatures, tickets and Gatekeeper acceptance
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(target/release/bundle/dmg/*.dmg)
          [[ ${#images[@]} -eq 1 ]]
          bash scripts/macos-signing.sh verify \
            target/release/bundle/macos/Dispatch.app "${images[0]}"
          {
            echo '### Developer ID verification passed'
            echo 'Source: `${{ needs.source.outputs.sha }}`'
            echo 'App, dispatch-review and Ferropi: Developer ID, expected team, hardened runtime and timestamp.'
            echo 'App and DMG: valid stapled tickets and Gatekeeper assessment.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dispatch-macos-aarch64-signed
          if-no-files-found: error
          retention-days: 14
          path: target/release/bundle/dmg/*.dmg
      - name: Remove signing credentials and restore keychain search list
        if: always()
        run: bash scripts/macos-signing.sh cleanup
