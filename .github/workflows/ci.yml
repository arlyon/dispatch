name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to verify (empty uses the selected workflow commit)
        type: string
        default: ''
      verify_macos_signing:
        description: Also build a Developer ID signed/notarized DMG; never publishes a release
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build (defaults to the caller commit)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  check-and-package:
    name: Check and package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Require an immutable manual signing source
        if: github.event_name == 'workflow_dispatch' && inputs.verify_macos_signing
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          # Empty uses github.sha. Named branches could change between CI and signing.
          if [[ -n "$SOURCE_REF" && ! "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'For signing verification, leave ref empty or supply a full commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The Azure mirror stalled for 24 minutes on the release recovery.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if path.is_file():
                  text = path.read_text()
                  path.write_text(text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu'))
          PY
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        env:
          MISE_NPM_PACKAGE_MANAGER: npm
      - name: Install Rust check components
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-on-failure: true
      - run: mise run setup
      - run: mise run check
      - run: mise run package
        env:
          # Ad-hoc signing only. Not an Apple Developer signature/notarization.
          APPLE_SIGNING_IDENTITY: '-'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dispatch-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg

  verify-signing:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos_signing
    needs: check-and-package
    uses: ./.github/workflows/sign-macos.yml
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      ref: ${{ inputs.ref || github.sha }}
