[tools]
rust = "1.97.1"
node = "22.19.0"
"npm:pnpm" = "12.7.0"

[tasks.setup]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
run = "node scripts/build.mjs --dev"

[tasks.build]
run = "node scripts/build.mjs --debug"

[tasks.package]
description = "Build release installers for the current platform"
run = "node scripts/build.mjs"

[tasks.fix]
run = ["cargo fmt --all", "node scripts/frontend-fingerprint.mjs"]

[tasks.check]
run = ["node scripts/sync-version.mjs --check", "node scripts/frontend-fingerprint.mjs --check", "pnpm exec tsc --noEmit", "node --check src-tauri/extensions/quiz.mjs", "node --test tests/*.test.mjs", "pnpm build", "cargo fmt --all -- --check", "cargo clippy --workspace --all-targets --all-features -- -D warnings", "cargo test --workspace --all-features"]
