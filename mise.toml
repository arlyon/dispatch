[tools]
rust = "1.97.1"
node = "22.19.0"
pnpm = "12.7.0"

[tasks.setup]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
run = "pnpm tauri dev"

[tasks.build]
run = ["cargo build -p ferropi", "pnpm tauri build --debug --bundles app"]

[tasks.fix]
run = "cargo fmt --all"

[tasks.check]
run = ["pnpm exec tsc --noEmit", "node --test tests/sticky-geometry.test.mjs", "pnpm build", "cargo fmt --all -- --check", "cargo clippy --workspace --all-targets --all-features -- -D warnings", "cargo test --workspace --all-features"]
