[package]
name = "dispatch"
default-run = "dispatch"
version.workspace = true
publish = false
license.workspace = true
description = "Agent-assisted change review inbox"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "sync"] }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "=2.14.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
